<!--
Image assets: desk.png, eraser.png, pencil-case.png, ruler.png,
and the red, yellow and blue pencil images (including short versions).
Generated using ChatGPT by OpenAI (2026).
Prompts requested matching illustrated stationery for Pencil Jam,
with a separate ruler and a desk background without pencil slots.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pencil Jam</title>

  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>


<body>
<!--I asked ChatGPT why pencil hover was silent when the page first opened. I learned
that browsers may block Web Audio until the user clicks. The Start button gives
the user that first interaction.
-->
<dialog id="intro-dialog" aria-labelledby="intro-title">
    <div class="intro-content">

        <h1 id="intro-title">Welcome to Pencil Jam!</h1>
<!--        icons was generated by chatGPT, generated on 26 Oct.-->
        <div class="intro-subtitle-row">
            <img src="sources/introGirl1.png"
                 class="intro-girl"
                 alt=""
                 draggable="false">

            <p class="intro-subtitle">Let's make some music.</p>

            <img src="sources/introGirl2.png"
                 class="intro-girl"
                 alt=""
                 draggable="false">
        </div>

        <div class="intro-instructions">
            <p>Drag a pencil into the grid to make music</p>
            <p>Click a pencil to change its volume</p>
            <p>Drag the eraser to remove a note</p>
            <p>Slide along the ruler to change the speed</p>
        </div>

        <p class="intro-ending">Ready? Let's jam!</p>
        <button id="start-button" type="button">Play</button>
    </div>
</dialog>
<main class="game">

  <!--Insert desk background img -->
  <img class="desk-background" src="sources/desk.png" alt="">

  <!--set up a stage for interaction -->
  <div class="stage">

    <!--Pencil case belong to background，so I use img tag here,
     but pencils and eraser have their functions, so I use button here.-->
<!--    Someone gave me a feedback: there is a bug here, sometimes this img can be dragged.
        I think the reason is browser native image drag.-->
    <section class="case-stage">
<!--      use html to manage static img-->
      <span class="asset art-case">
         <img src="sources/pencil-case.png" alt="" draggable="false">
      </span>

      <button class="pencil-button red-pencil" data-pencil="red" aria-label="Red pencil">
        <img src="sources/pencil-red.png" alt="">
      </button>

      <button class="pencil-button yellow-pencil" data-pencil="yellow" aria-label="Yellow pencil">
        <img src="sources/pencil-yellow.png" alt="">
      </button>

      <button class="pencil-button blue-pencil" data-pencil="blue" aria-label="Blue pencil">
        <img src="sources/pencil-blue.png" alt="">
      </button>

      <button class="eraser-button" id="eraser-button" aria-label="Eraser">
        <img src="sources/eraser.png" alt="">
      </button>
    </section>

<!--insert ruler img, ruler as speed control. And I will make some prototypes by using
js and css on it, so I did not use button here.-->
<!--    html manage it instead of js-->
<!--    add turtle (low) and rabbit (fast) icon as an information design-->
<!--      these two icons was generated by chatGPT, generated on 26 Oct.-->
      <div class="speed-control">
          <img class="speed-icon turtle-icon" src="sources/turtle.png" alt="Slow" draggable="false">

          <section class="ruler-stage">
        <span class="asset art-ruler">
            <img src="sources/ruler.png" alt="Ruler" draggable="false">
        </span>
          </section>

          <img class="speed-icon rabbit-icon" src="sources/rabbit.png" alt="Fast" draggable="false">

      </div>

      <!--Playback control -->
      <button id="playback-button" class="playback-button" type="button" aria-label="Pause music">
          <span class="playback-icon is-pause" aria-hidden="true"></span>
      </button>

    <!--Music grid: 3 rows and 6 steps -->
    <section class="music-grid">
      <button class="note-slot" data-row="0" data-step="0" aria-label="Row 1, step 1, empty"></button>
      <button class="note-slot" data-row="0" data-step="1" aria-label="Row 1, step 2, empty"></button>
      <button class="note-slot" data-row="0" data-step="2" aria-label="Row 1, step 3, empty"></button>
      <button class="note-slot" data-row="0" data-step="3" aria-label="Row 1, step 4, empty"></button>
      <button class="note-slot" data-row="0" data-step="4" aria-label="Row 1, step 5, empty"></button>
      <button class="note-slot" data-row="0" data-step="5" aria-label="Row 1, step 6, empty"></button>

      <button class="note-slot" data-row="1" data-step="0" aria-label="Row 2, step 1, empty"></button>
      <button class="note-slot" data-row="1" data-step="1" aria-label="Row 2, step 2, empty"></button>
      <button class="note-slot" data-row="1" data-step="2" aria-label="Row 2, step 3, empty"></button>
      <button class="note-slot" data-row="1" data-step="3" aria-label="Row 2, step 4, empty"></button>
      <button class="note-slot" data-row="1" data-step="4" aria-label="Row 2, step 5, empty"></button>
      <button class="note-slot" data-row="1" data-step="5" aria-label="Row 2, step 6, empty"></button>

      <button class="note-slot" data-row="2" data-step="0" aria-label="Row 3, step 1, empty"></button>
      <button class="note-slot" data-row="2" data-step="1" aria-label="Row 3, step 2, empty"></button>
      <button class="note-slot" data-row="2" data-step="2" aria-label="Row 3, step 3, empty"></button>
      <button class="note-slot" data-row="2" data-step="3" aria-label="Row 3, step 4, empty"></button>
      <button class="note-slot" data-row="2" data-step="4" aria-label="Row 3, step 5, empty"></button>
      <button class="note-slot" data-row="2" data-step="5" aria-label="Row 3, step 6, empty"></button>
    </section>

  </div>
</main>
</body>
</html>
